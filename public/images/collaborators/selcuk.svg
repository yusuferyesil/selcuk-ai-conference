    <rect x="10" y="10" width="40" height="40" stroke="#0D5C75" stroke-width="2" fill="none" transform="rotate(45 30 30)"/>
    <circle cx="30" cy="30" r="10" stroke="#C59B27" stroke-width="1.5" fill="#0D5C75"/>
